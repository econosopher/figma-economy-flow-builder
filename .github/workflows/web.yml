name: Web editor checks
on:
  workflow_dispatch:
  push:
    paths: ['web/**', 'examples/**', 'src/research-contract.ts', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'examples/**', 'src/research-contract.ts', '.github/workflows/web.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx wrangler deploy --dry-run --env staging
